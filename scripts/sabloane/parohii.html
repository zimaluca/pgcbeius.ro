<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parohiile protopopiatului | Protopopiatul Greco-Catolic Beiuș</title>
  <meta name="description" content="Harta și lista parohiilor greco-catolice ale Protopopiatului Beiuș.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Parohiile Protopopiatului Greco-Catolic Beiuș">
  <meta property="og:description" content="Harta și lista parohiilor greco-catolice ale Protopopiatului Beiuș.">
  <meta property="og:url" content="{{url}}">
  <meta name="theme-color" content="#7A1E2C">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">

  <link rel="stylesheet" href="../assets/css/fonturi.css">
  <link rel="stylesheet" href="../assets/css/variabile.css">
  <link rel="stylesheet" href="../assets/css/stil.css">
  <link rel="stylesheet" href="../assets/css/pagini.css">
  <link rel="stylesheet" href="../assets/css/parohii.css">
</head>
<body class="pagina-interioara">

{{nav}}
  <main id="continut">
    <div class="container">
      <header class="antet-pagina">
        <p class="firimituri"><a href="../index.html">Acasă</a> / Parohii</p>
        <h1>Parohiile protopopiatului</h1>
        <p class="intro">Comunitățile greco-catolice ale Protopopiatului Beiuș. Alegeți o parohie de pe hartă sau din listă.</p>
      </header>

      <div class="parohii">
        <div id="harta-parohii" class="parohii__harta" role="region" aria-label="Harta parohiilor"></div>
        <div class="parohii__lista">
          <p class="parohii__numar">{{numar}}</p>
          <ul class="lista-parohii">
{{lista}}
          </ul>
        </div>
      </div>
    </div>
  </main>

{{subsol}}
  <script type="application/json" id="date-parohii">{{date}}</script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="../assets/js/pagina.js" defer></script>
  <script src="../assets/js/harta-parohii.js" defer></script>
</body>
</html>
