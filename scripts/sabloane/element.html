<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{titlu}}</title>
  <meta name="description" content="{{descriere}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{titlu}}">
  <meta property="og:description" content="{{descriere}}">
  <meta property="og:url" content="{{url}}">
{{ogImagine}}
  <meta name="theme-color" content="#7A1E2C">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">

  <link rel="stylesheet" href="../assets/css/fonturi.css">
  <link rel="stylesheet" href="../assets/css/variabile.css">
  <link rel="stylesheet" href="../assets/css/stil.css">
  <link rel="stylesheet" href="../assets/css/pagini.css">
  <link rel="stylesheet" href="../assets/css/parohii.css">
</head>
<body class="pagina-interioara">

{{nav}}
  <main id="continut">
    <div class="container">
      <header class="antet-pagina">
        <p class="firimituri"><a href="./">{{titluLista}}</a> / {{localitate}}</p>
        <h1>{{nume}}</h1>
{{notaTest}}
      </header>

      <div class="parohie__sus">
        <div class="parohie__imagine">{{imagine}}</div>
        <dl class="fisa">{{fisa}}</dl>
      </div>

{{sectiuni}}
      <section class="parohie__locatie" aria-labelledby="titlu-locatie">
        <div>
          <h2 id="titlu-locatie">Unde se află</h2>
          <p>{{adresaText}}</p>
          <a class="buton buton--plin" href="./?{{parametru}}={{slug}}">Vezi pe harta mare</a>
        </div>
        <div id="harta-parohie" class="parohie__harta" data-slug="{{slug}}" role="img" aria-label="{{etichetaHartaMica}}"></div>
      </section>

{{galerie}}    </div>
  </main>

{{subsol}}
  <script type="application/json" id="date-parohii" data-parametru="{{parametru}}" data-link="{{textLink}}">{{date}}</script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="../assets/js/pagina.js" defer></script>
  <script src="../assets/js/harta-parohii.js" defer></script>
  <script src="../assets/js/galerie.js" defer></script>
</body>
</html>
